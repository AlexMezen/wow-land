<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101713" />
    <meta
      name="description"
      content="Коттедж Інвест — заміська нерухомість як зрозумілий інвестиційний продукт."
    />
    <meta property="og:title" content="Коттедж Інвест — архітектура капіталу" />
    <meta
      property="og:description"
      content="Добір, створення та керування дохідною заміською нерухомістю."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/hero-cabin.webp" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="image"
      href="/images/hero-cabin.webp"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/brand-mark.svg"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@400;500;600&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Коттедж Інвест — архітектура капіталу</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Коттедж Інвест",
        "description": "Інвестиційні проєкти у заміській нерухомості",
        "areaServed": "Ukraine"
      }
    </script>
  </head>
  <body>
    <div class="loader" id="loader" aria-hidden="true">
      <div class="loader__inner">
        <img
          src="/brand-mark.svg"
          alt=""
          width="54"
          height="54"
          decoding="async"
        />
        <div class="loader__line"><span></span></div>
        <p>Building value</p>
      </div>
    </div>
    <canvas id="world-canvas" class="world-canvas" aria-hidden="true"></canvas>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
